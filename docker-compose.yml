# ─────────────────────────────────────────────────────────────────────────────
# VibeVoice BR — Docker Compose (CPU-only)
# Para deploy com GPU, use: docker-compose -f docker-compose.yml -f docker-compose.gpu.yml up
# ─────────────────────────────────────────────────────────────────────────────
version: '3.9'

services:

  # ─── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: vibevoice-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vibevoice
      POSTGRES_USER: vibevoice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vibevoice_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibevoice"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vibevoice-net

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: vibevoice-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - vibevoice-net

  # ─── Backend FastAPI ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vibevoice-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://vibevoice:${POSTGRES_PASSWORD:-vibevoice_secret}@postgres:5432/vibevoice
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      VIBEVOICE_DEVICE: cpu
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
    volumes:
      - audio_data:/data/audio_outputs
      - upload_data:/data/uploads
      - model_data:/models
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    networks:
      - vibevoice-net

  # ─── Celery Worker (tarefas async) ───────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vibevoice-worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://vibevoice:${POSTGRES_PASSWORD:-vibevoice_secret}@postgres:5432/vibevoice
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
    volumes:
      - audio_data:/data/audio_outputs
      - upload_data:/data/uploads
      - model_data:/models
    depends_on:
      - backend
      - redis
    networks:
      - vibevoice-net

  # ─── Frontend Next.js ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8000}
    container_name: vibevoice-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - vibevoice-net

  # ─── Admin Panel Next.js ──────────────────────────────────────────────────
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8000}
    container_name: vibevoice-admin
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3001:3001"
    depends_on:
      - backend
    networks:
      - vibevoice-net

  # ─── Nginx Proxy Reverso ──────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: vibevoice-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
      - audio_data:/var/www/audio:ro
    depends_on:
      - frontend
      - backend
      - admin
    networks:
      - vibevoice-net

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  audio_data:
  upload_data:
  model_data:
  nginx_logs:

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  vibevoice-net:
    driver: bridge
